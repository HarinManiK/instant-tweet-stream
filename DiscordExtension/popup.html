<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 260px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    background: #2b2d31; color: #dbdee1;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: #949ba4; font-size: 11px; margin-bottom: 12px; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f23f43; }
  .dot.on { background: #23a55a; box-shadow: 0 0 6px #23a55a; }
  .status .label { font-weight: 600; }
  .count { margin-left: auto; color: #949ba4; }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 9px 12px; border: none;
    border-radius: 6px; cursor: pointer; color: #fff;
  }
  #open { background: #4e5058; margin-top: 8px; font-size: 12px; padding: 7px 12px; }
  #open:hover { background: #5c5e66; }
  #site { background: #5865f2; }
  #site:hover { background: #4752c4; }
</style>
</head>
<body>
  <h1>Feed Reader</h1>
  <div class="sub">Everything stays on this device.</div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="label" id="label">…</span>
    <span class="count" id="count"></span>
  </div>

  <button id="site">Open live feed</button>
  <button id="open">Local capture check</button>

<script src="popup.js"></script>
</body>
</html>
