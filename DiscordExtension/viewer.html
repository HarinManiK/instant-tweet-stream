<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feed Reader</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1e1f22; color: #dbdee1;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    flex: 0 0 auto; padding: 12px 20px; background: #2b2d31;
    border-bottom: 1px solid #1e1f22; display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f23f43; transition: background .2s; }
  .dot.live { background: #23a55a; box-shadow: 0 0 8px #23a55a; }
  .count { margin-left: auto; color: #949ba4; font-size: 13px; }
  .tools { display: flex; gap: 8px; margin-left: 16px; }
  .tools button {
    font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border: none;
    border-radius: 6px; cursor: pointer; color: #fff;
  }
  #toggle.on { background: #f23f43; }
  #toggle.off { background: #23a55a; }
  #clear { background: #4e5058; }
  #clear:hover { background: #5c5e66; }

  .note {
    flex: 0 0 auto; padding: 8px 20px; font-size: 12px; color: #949ba4;
    background: #232428; border-bottom: 1px solid #1e1f22;
  }

  #feed {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 20px;
    display: flex; flex-direction: column; gap: 10px; min-height: 0;
  }

  /* Discord cards */
  .msg {
    position: relative; padding: 10px 14px; background: #2b2d31; border-radius: 8px;
    border-left: 3px solid #5865f2; animation: pop .25s ease;
  }
  .msg.clickable { cursor: pointer; }
  .msg.clickable:hover { background: #34363c; border-left-color: #7983f5; }
  .msg .loc {
    display: inline-block; font-size: 11px; font-weight: 700; color: #c9cdfb;
    background: rgba(88,101,242,0.20); padding: 2px 9px; border-radius: 10px; margin-bottom: 6px;
  }
  .msg .reply {
    font-size: 12px; color: #b5bac1; margin-bottom: 4px; padding-left: 8px;
    border-left: 2px solid #4e5058; opacity: .9;
  }
  .msg .top { display: flex; align-items: baseline; gap: 8px; }
  .msg .author { font-weight: 600; color: #fff; }
  .msg .time { font-size: 11px; color: #949ba4; }
  .msg .content { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }

  .del-btn {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; padding: 0;
    border: none; border-radius: 50%; background: rgba(255,255,255,.07); color: #949ba4;
    font-size: 14px; line-height: 1; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .del-btn:hover { background: #f23f43; color: #fff; }

  .empty { color: #949ba4; padding: 40px 20px; text-align: center; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #soundhint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #5865f2; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 20px; cursor: pointer; z-index: 50;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); user-select: none;
    transition: background .15s ease;
  }
  #soundhint:hover { background: #4752c4; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Feed Reader</h1>
    <span class="count" id="count">0 messages</span>
    <div class="tools">
      <button id="toggle" class="on">Stop</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <div class="note">Local capture check. The full two-column feed (X + Discord) lives on the hosted site.</div>
  <div id="feed"><div class="empty" id="empty">Waiting for Discord messages…</div></div>
  <audio id="ping" src="kaching.mp3" preload="auto"></audio>
  <div id="soundhint">🔔 Click here to enable notification sound</div>
<script src="viewer.js"></script>
</body>
</html>
